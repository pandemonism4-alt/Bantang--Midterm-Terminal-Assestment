name: strm
description: SecureCloud Task & Resource Manager - A hybrid productivity Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2

  # Local DB
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  http: ^1.2.2

  # Connectivity
  connectivity_plus: ^6.1.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
